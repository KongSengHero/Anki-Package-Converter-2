<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Raw Text to Anki &amp; JSON Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="src/converter.css" />
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Vocabulary Text to Anki &amp; JSON Converter</h1>
      <p class="subtitle">Parse raw Japanese + English notes into official Kaishi 1.5k Anki Packages (.apkg) &amp; JSON decks.</p>
    </div>
  </header>

  <div class="card">
    <div class="settings-row">
      <div class="field-group">
        <label class="field-label" for="deckNameInput">Anki Deck Name</label>
        <input type="text" id="deckNameInput" value="Japanese IT Pathway::Vocab" placeholder="e.g. Japanese IT Pathway::Step 2 Vocab 1" />
      </div>
      <div class="field-group">
        <label class="field-label" for="deckTagInput">Card Tag</label>
        <input type="text" id="deckTagInput" value="IT_Pathway" placeholder="e.g. IT_Pathway" />
      </div>
    </div>

    <div class="generator-panel">
      <div class="generator-header">
        <div class="generator-title">
          <span>✨ Auto Example Sentence &amp; Translation Generator</span>
        </div>
        <span style="font-size: 0.8rem; color: #94a3b8;">Kaishi 1.5k: Word, Sentence &amp; Translations</span>
      </div>
      <div class="generator-options">
        <div class="field-group">
          <label class="field-label" for="genProviderSelect">Generation Engine</label>
          <select id="genProviderSelect" onchange="handleProviderChange()">
            <option value="zero-key">Zero-API-Key (Auto-Translate &amp; Native DB)</option>
            <option value="gemini">Google Gemini AI (Custom Key)</option>
            <option value="openai">OpenAI / Compatible (Custom Key)</option>
          </select>
        </div>
        <div class="field-group" id="apiKeyGroup" style="display: none;">
          <label class="field-label" for="apiKeyInput">API Key</label>
          <input type="text" id="apiKeyInput" placeholder="Enter API Key" onchange="saveAiConfig()" />
        </div>
        <div class="field-group" id="apiModelGroup" style="display: none;">
          <label class="field-label" for="apiModelSelect">Model</label>
          <select id="apiModelSelect" onchange="saveAiConfig()">
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
          </select>
        </div>
      </div>
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Generating sentences...</div>
      </div>
    </div>

    <textarea id="rawInput" placeholder="Paste raw notes or JSON array here... Examples:

企業概要 [きぎょうがいよう] Company Overview
例文: 取引先の企業概要を確認して信用調査を行う。

要件定義 [ようけんていぎ] Requirements Definition
例: クライアントと打ち合わせをして要件定義書を作成する。

クラウド Cloud Computing
例文: 社内システムをクラウド環境に移行する。

暗号化 [あんごうか] Encryption
例: 通信データをSSLで暗号化する。"></textarea>

    <div class="btn-group">
      <button onclick="processRawText()">Parse &amp; Preview</button>
      <button class="secondary" id="autoGenBtn" onclick="runBatchGeneration(false)">✨ Auto-Generate Sentences</button>
      <label class="btn secondary" style="cursor: pointer;">
        Import JSON File
        <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleJsonImport(event)" />
      </label>
      <button class="secondary" onclick="loadSampleText()">Load Sample Notes</button>
      <button class="secondary" onclick="clearInput()">Clear</button>
    </div>
  </div>

  <div class="card preview-section" id="previewSection">
    <div class="preview-header">
      <h2 style="font-size: 1.2rem; font-weight: 700; color: #fff;">
        Parsed Preview (<span id="cardCount">0 cards</span>)
      </h2>
      <div class="btn-group">
        <button class="secondary" onclick="runBatchGeneration(true)">✨ Regenerate All Sentences</button>
        <button class="export-apkg" id="exportApkgBtn" onclick="exportAnki(true)">Download with Audio (.apkg)</button>
        <button class="secondary" id="exportNoAudioBtn" onclick="exportAnki(false)">Download Without Audio (.apkg)</button>
        <button class="success" onclick="downloadJSON()">Download JSON</button>
        <button class="secondary" onclick="copyJSON()">Copy JSON</button>
      </div>
    </div>

    <div class="preview-tabs">
      <button class="tab-btn active" id="tabBtnKaishi" onclick="switchTab('kaishi')">Kaishi 1.5k Preview</button>
      <button class="tab-btn" id="tabBtnList" onclick="switchTab('list')">Card List</button>
    </div>

    <div class="tab-content active" id="tabKaishi">
      <div class="kaishi-simulator">
        <div class="sim-controls">
          <button class="secondary" onclick="prevSimCard()">Prev</button>
          <span id="simIndex" style="font-size: 0.9rem; font-weight: 700; color: var(--text-sub);">Card 1 / 1</span>
          <button class="secondary" onclick="nextSimCard()">Next</button>
          <button class="secondary" onclick="toggleSimAnswer()" id="simToggleBtn">Flip (Show Back)</button>
        </div>

        <div class="sim-card" id="simCard"></div>
      </div>
    </div>

    <div class="tab-content" id="tabList">
      <div class="card-list" id="cardList"></div>
    </div>
  </div>
</div>

<script src="src/kanji_data.js"></script>
<script src="src/parser.js"></script>
<script src="src/generator.js"></script>
<script src="src/anki_exporter.js"></script>
<script src="src/main.js"></script>
</body>
</html>
